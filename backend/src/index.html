<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Arena - Test Completo</title>
    <style>
        body { 
            background: #0a0a0c; color: #fff; margin: 0; display: flex; 
            justify-content: center; align-items: center; height: 100vh; 
            font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden;
        }
        
        #ui-panel { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(15, 15, 20, 0.95); padding: 20px; 
            border-radius: 10px; border: 1px solid #333; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 10; width: 320px;
        }

        #data-panel {
            position: absolute; top: 20px; right: 20px; 
            background: rgba(10, 10, 15, 0.9); padding: 15px; 
            border-radius: 8px; border: 1px dashed #555;
            color: #00ffcc; font-family: monospace; font-size: 13px; z-index: 10;
            width: 300px;
        }

        h3 { margin-top: 0; color: #00e5ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], input[type="number"] { width: 60px; padding: 5px; background: #000; border: 1px solid #555; color: #fff; text-align: center; border-radius: 4px; }
        input[type="text"] { width: 100%; box-sizing: border-box; text-align: left;}
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 12px; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.2s; font-size: 14px; }
        .btn-ai { background: #9c27b0; } .btn-ai:hover { background: #7b1fa2; }
        .btn-local { background: #2196F3; } .btn-local:hover { background: #1976D2; }
        .btn-reconnect { background: #4CAF50; } .btn-reconnect:hover { background: #388E3C; }
        .btn-chat { background: #ff9800; padding: 8px; font-size: 12px;} .btn-chat:hover { background: #f57c00; }
        
        #connStatus { margin-top: 15px; font-weight: bold; text-align: center; color: #ff5252; background: #111; padding: 8px; border-radius: 4px; border: 1px solid #222; }
        
        #errorToast { display: none; margin-top: 15px; background: #b71c1c; padding: 10px; border-radius: 4px; border: 1px solid #ff5252; font-size: 12px; }

        canvas { background: #121215; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.9); border: 2px solid #222;}

        #chat-box { margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h3>Menu Test Backend</h3>
        <div class="form-group">
            <label>User ID (DB):</label>
            <input type="number" id="userId" value="1">
        </div>
        <div class="btn-group">
            <button class="btn-local" onclick="startMatchmaking(false)">🎮 Avvia Locale (P1 + P2)</button>
            <button class="btn-ai" onclick="startMatchmaking(true)">🤖 Avvia vs AI (P1 + Bot)</button>
            <button class="btn-reconnect" onclick="reconnectOnly()">🔄 Simula Riconnessione (F5)</button>
        </div>
        <div id="connStatus">Disconnesso</div>

        <div id="errorToast">
            <strong id="errorCode">ERROR_CODE</strong><br>
            <span id="errorMsg">Message here</span>
        </div>

        <div id="chat-box">
            <div class="form-group">
                <input type="text" id="chatMsg" placeholder="Scrivi in chat...">
            </div>
            <button class="btn-chat" style="width: 100%;" onclick="sendGameMessage()">Invia Chat</button>
        </div>
        
        <div style="margin-top: 20px; font-size: 11px; color: #777;">
            <strong>P1 (Azzurro):</strong> WASD + J (Corpo), K (Magia), L (Scudo)<br>
            <strong>P2 (Rosso):</strong> Frecce + 1 (Corpo), 2 (Magia), 3 (Scudo)
        </div>
    </div>

    <div id="data-panel">
        <div style="color: #fff; margin-bottom: 5px; font-weight: bold;">Dati Server live:</div>
        <div id="debugMap">Mappa: Non ricevuta</div>
        <div id="debugTime" style="color: #fff;">Tempo: 0s</div>
        <div id="debugPlayers">Giocatori: 0</div>
        <div id="debugCoords" style="margin-top: 10px; font-size: 11px; color: #ffeb3b;">Nessuna coordinata</div>
    </div>

    <canvas id="gameCanvas" width="900" height="900"></canvas>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('connStatus');
        const errorToast = document.getElementById('errorToast');
        
        let socket = null;
        let mapData = null;      
        let playersArray = []; 
        let bulletsArray = [];
        let SCALE = 6;           

        // --- 1. SIMULAZIONE DEL MATCHMAKING (HTTP POST) ---
        async function startMatchmaking(isAi) {
            if (socket) socket.disconnect();
            hideError();
            
            const userId = parseInt(document.getElementById('userId').value) || 1;
            const gameId = 'sandbox-' + Math.floor(Math.random() * 1000);
            
            statusEl.style.color = '#ffeb3b';
            statusEl.innerText = "Chiamata Matchmaking...";

            let playersData = [];
            if (isAi) {
                playersData.push({ characterName: 'ade', userDbId: userId, isAiPlayer: false, playerIndex: 0 });
                playersData.push({ characterName: 'zeus', userDbId: null, isAiPlayer: true, playerIndex: 1 });
            } else {
                playersData.push({ characterName: 'ade', userDbId: userId, isAiPlayer: false, playerIndex: 0 });
                playersData.push({ characterName: 'zeus', userDbId: userId, isAiPlayer: false, playerIndex: 1 });
            }

            try {
                const response = await fetch('http://localhost:3000/matchmaking/create_match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        playersData: playersData,
                        gameId: gameId,
                        matchType: 'ffa',
                        matchMode: isAi ? 'ai' : 'local'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    showError('HTTP_ERROR', errorData.message || "Matchmaking negato");
                    throw new Error("Matchmaking negato");
                }

                // Chiamata andata a buon fine, ci colleghiamo al Socket!
                connectToGame(userId, isAi);
            } catch (error) {
                statusEl.style.color = '#ff5252';
                statusEl.innerText = "Errore Connessione";
            }
        }

        // --- 2. RICONNESSIONE PURA (Senza passare dal Matchmaking) ---
        function reconnectOnly() {
            const userId = parseInt(document.getElementById('userId').value) || 1;
            if (socket) socket.disconnect();
            hideError();
            connectToGame(userId, false);
        }

        // --- 3. GESTIONE WEBSOCKET ---
        function connectToGame(userId, isAi) {
            statusEl.innerText = "Connessione Socket...";

            // Query parameter richiesto dal GameGateway
            socket = io('http://localhost:3000', {
                query: { userDbId: userId },
                transports: ['websocket']
            });

            socket.on('connect', () => {
                statusEl.style.color = '#4CAF50';
                statusEl.innerText = isAi ? "In Gioco (vs AI)" : "In Gioco (Locale)";
                document.getElementById('chat-box').style.display = 'block';
            });

            socket.on('disconnect', () => {
                statusEl.style.color = '#ff5252';
                statusEl.innerText = "Disconnesso.";
                document.getElementById('chat-box').style.display = 'none';
                playersArray = []; bulletsArray = []; mapData = null;
            });

            // GESTIONE ECCEZIONI DA NESTJS (Il tuo GameExceptionFilter)
            socket.on('exception', (payload) => {
                console.error("Eccezione dal Server:", payload);
                showError(payload.errorCode || 'UNKNOWN_ERROR', payload.message);
                
                // Se la sessione non esiste o l'utente non è trovato, disconnetti il client
                if (payload.errorCode === 'SESSION_NOT_FOUND' || payload.errorCode === 'PLAYER_NOT_FOUND') {
                    socket.disconnect();
                }
            });

            socket.on('map-emit', (payload) => {
                if (payload && payload.map) {
                    mapData = payload.map;
                    const maxMapSize = Math.max(mapData.width || 130, mapData.depth || 130);
                    SCALE = (canvas.width * 0.95) / maxMapSize; 
                    document.getElementById('debugMap').innerText = `Mappa: ${mapData.width}x${mapData.depth}`;
                }
            });

            socket.on('game-state', (payload) => {
                if (!payload || !payload.entities) return;
                
                playersArray = payload.entities.players || [];
                bulletsArray = payload.entities.bullets || [];
                
                document.getElementById('debugTime').innerText = `Tempo: ${Math.round(payload.time)}s`;
                document.getElementById('debugPlayers').innerText = `Giocatori: ${playersArray.length}`;
                
                if (playersArray.length > 0) {
                    document.getElementById('debugCoords').innerHTML = playersArray.map(p => {
                        let statusText = '✅ VIVO';
                        if (p.isDead) statusText = '💀 MORTO';
                        else if (p.isDisconnected) statusText = '🔌 OFFLINE';
                        else if (p.isDefending) statusText = '🛡️ DIFESA';
                        
                        return `P${p.teamId} [${p.characterName}]: HP: ${Math.floor(p.hp)} <br>Stato: ${statusText}`;
                    }).join('<br><br>');
                }
            });

            socket.on('game-message', (payload) => {
                alert(`Chat (User ${payload.author}): ${payload.message}`);
            });

            socket.on('game-over', (payload) => {
                statusEl.style.color = '#ff9800';
                statusEl.innerText = "Partita Terminata! Vincitore: Team " + payload.entities.winnerTeam;
            });
        }

        // --- FUNZIONI DI SUPPORTO UI ---
        function sendGameMessage() {
            if (!socket || !socket.connected) return;
            const msg = document.getElementById('chatMsg').value;
            if (msg.trim().length > 0) {
                socket.emit('game-message', { message: msg });
                document.getElementById('chatMsg').value = '';
            }
        }

        function showError(code, msg) {
            document.getElementById('errorCode').innerText = code;
            document.getElementById('errorMsg').innerText = msg;
            errorToast.style.display = 'block';
        }

        function hideError() {
            errorToast.style.display = 'none';
        }

        // --- 4. RENDER LOOP (Mappa, Giocatori, Magie) ---
        function renderLoop() {
            ctx.fillStyle = '#0f0f13';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2); 

            if (mapData) {
                const mapHalfWidth = (mapData.width || 130) / 2;
                const mapHalfDepth = (mapData.depth || 130) / 2;
                ctx.translate(-mapHalfWidth * SCALE, -mapHalfDepth * SCALE);

                // Disegna Pavimento
                ctx.fillStyle = '#16161c';
                ctx.fillRect(0, 0, mapData.width * SCALE, mapData.depth * SCALE);
                
                // Disegna Muri
                if (mapData.walls) {
                    ctx.fillStyle = '#333';
                    mapData.walls.forEach(wall => {
                        ctx.fillRect((wall.position.x - wall.width / 2) * SCALE, (wall.position.z - wall.depth / 2) * SCALE, wall.width * SCALE, wall.depth * SCALE);
                    });
                }

                // Disegna Colonne
                if (mapData.pillars) {
                    ctx.fillStyle = '#555';
                    mapData.pillars.forEach(pillar => {
                        ctx.beginPath();
                        ctx.arc(pillar.position.x * SCALE, pillar.position.z * SCALE, pillar.radius * SCALE, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            }

            // Disegna Proiettili (Spell)
            bulletsArray.forEach(b => {
                if (!b.position) return;
                ctx.beginPath();
                ctx.arc(b.position.x * SCALE, b.position.z * SCALE, 6, 0, Math.PI * 2);
                ctx.fillStyle = b.teamId === 0 ? '#00e5ff' : '#ff1744'; 
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            });

            // Disegna Giocatori
            playersArray.forEach(p => {
                if (!p || !p.position) return; 
                
                const sx = p.position.x * SCALE;
                const sz = p.position.z * SCALE; 

                // Ombra / Area visiva
                ctx.beginPath(); 
                ctx.arc(sx, sz, 35, 0, Math.PI * 2);
                ctx.fillStyle = p.teamId === 0 ? 'rgba(0, 229, 255, 0.1)' : 'rgba(255, 23, 68, 0.1)';
                ctx.fill();

                // Corpo
                ctx.beginPath(); 
                ctx.arc(sx, sz, 15, 0, Math.PI * 2);
                
                if (p.isDead) ctx.fillStyle = '#444';
                else if (p.isGhost || p.hp <= 0) ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; 
                else ctx.fillStyle = p.teamId === 0 ? '#00e5ff' : '#ff1744';
                
                ctx.fill(); 
                
                // Effetti di stato (Scudo = Bordo Giallo)
                ctx.lineWidth = 3; 
                ctx.strokeStyle = p.isDefending ? '#ffeb3b' : '#fff'; 
                ctx.stroke();

                // Direzione visiva e Attacco (Attacco = Raggio Giallo)
                if (!p.isDead) {
                    ctx.beginPath(); ctx.moveTo(sx, sz);
                    ctx.lineTo(sx + Math.cos(p.rotation || 0) * 25, sz + Math.sin(p.rotation || 0) * 25);
                    ctx.strokeStyle = p.isAttacking ? '#ffeb3b' : '#fff';
                    ctx.lineWidth = p.isAttacking ? 6 : 4; 
                    ctx.stroke();
                }
            });

            ctx.restore();
            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);

        // --- 5. INPUT LOOP MULTIPLAYER ---
        const keys = { 0: { x: 0, z: 0, a: null }, 1: { x: 0, z: 0, a: null } };

        setInterval(() => {
            if (!socket || !socket.connected) return;
            
            // Invio DTO per Player 1
            const p1 = { x: keys[0].x, z: keys[0].z, playerIndex: 0 };
            if (keys[0].a) p1.attackType = keys[0].a;
            socket.emit('game-input', p1);

            // Invio DTO per Player 2
            const p2 = { x: keys[1].x, z: keys[1].z, playerIndex: 1 };
            if (keys[1].a) p2.attackType = keys[1].a;
            socket.emit('game-input', p2);

            // Reset degli attacchi per non spammare il Socket
            keys[0].a = null; 
            keys[1].a = null;
        }, 16); 

        // Gestione Tastiera
        window.onkeydown = (e) => handleInput(e.key.toLowerCase(), true);
        window.onkeyup = (e) => handleInput(e.key.toLowerCase(), false);

        function handleInput(k, isDown) {
            // Player 1
            if (k === 'w') keys[0].z = isDown ? -1 : 0;
            if (k === 's') keys[0].z = isDown ? 1 : 0;
            if (k === 'a') keys[0].x = isDown ? -1 : 0;
            if (k === 'd') keys[0].x = isDown ? 1 : 0;
            if (k === 'j' && isDown) keys[0].a = 'melee-attack';
            if (k === 'k' && isDown) keys[0].a = 'spell-attack';
            if (k === 'l' && isDown) keys[0].a = 'defence-attack';

            // Player 2
            if (k === 'arrowup') keys[1].z = isDown ? -1 : 0;
            if (k === 'arrowdown') keys[1].z = isDown ? 1 : 0;
            if (k === 'arrowleft') keys[1].x = isDown ? -1 : 0;
            if (k === 'arrowright') keys[1].x = isDown ? 1 : 0;
            if (k === '1' && isDown) keys[1].a = 'melee-attack';
            if (k === '2' && isDown) keys[1].a = 'spell-attack';
            if (k === '3' && isDown) keys[1].a = 'defence-attack';
        }
    </script>
</body>
</html>
