services:
    postgres:
        container_name: transcendence_postgres
        image: postgres:17-alpine
        restart: unless-stopped
        networks:
            - backend-network
        expose:
            - "5432"
        env_file:
            - .env.shared
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    db-migration:
        container_name: transcendence_db_migration
        image: transcendence_db_migration:20-alpine
        build:
            context: .
            dockerfile: ./db-migration/Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        networks:
            - backend-network
        env_file:
            - .env.shared
        volumes:
            - ./shared/prisma:/app/prisma

    redis:
        image: redis:alpine
        container_name: redis_container
        networks:
            - transcendence_net

    auth-service:
        container_name: transcendence_auth_service
        image: transcendence_auth_service:20-alpine
        build:
            context: .
            dockerfile: ./auth-service/Dockerfile
            target: build # Dev mode: uses build stage with volume mounts
        command: npm run start:dev
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3002"
        env_file:
            - ./auth-service/.env
            - .env.shared
        volumes:
            - ./auth-service/src:/app/auth-service/src
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3002/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    user-service:
        container_name: transcendence_user_service
        image: transcendence_user_service:20-alpine
        build:
            context: .
            dockerfile: ./user-service/Dockerfile
            target: build # Dev mode: uses build stage with volume mounts
        command: sh -c "npm run prisma:generate && npm run start:dev"
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3001"
        env_file:
            - .env.shared
        volumes:
            - ./user-service/src:/app/user-service/src
            - ./shared/prisma/schema.prisma:/app/prisma/schema.prisma:ro
            - uploads_data:/uploads
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3001/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    game-service:
        container_name: transcendence_game_service
        image: transcendence_game_service:20-alpine
        build:
            context: .
            dockerfile: ./game-service/Dockerfile
            target: build # Dev mode: uses build stage with volume mounts
        command: sh -c "npm run prisma:generate && npm run start:dev"
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
            redis:
                condition: service_started
        networks:
            - backend-network
        expose:
            - "3000"
        env_file:
            - .env.shared
            - .env
        volumes:
            - ./game-service/src:/app/game-service/src
            - ./shared/prisma/schema.prisma:/app/prisma/schema.prisma:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3000/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    matchmaking-service:
        build: ./logic-service # Assicurati che il percorso sia corretto rispetto a dove metti questo file
        container_name: matchmaking_container
        ports:
            - "3500"
        depends_on:
            - redis
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - NODE_ENV=development
        networks:
            - backend-network

    frontend:
        build: ./frontend
        container_name: game_client
        ports:
            - "5173"
        volumes:
            - ./frontend:/usr/src/app/
            - /usr/src/app/node_modules
        environment:
            - VITE_API_URL=http://localhost:3000
        networks:
            - backend-network
    gateway:
        container_name: api_gateway
        image: nginx:stable-alpine
        restart: unless-stopped
        depends_on:
            auth-service:
                condition: service_healthy
            user-service:
                condition: service_healthy
            game-service:
                condition: service_healthy
            matchmaking-service:
                condition: service_started
            frontend:
                condition: service_started
        networks:
            - backend-network
        ports:
            - "2443:2443"
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs
            - uploads_data:/uploads

    ngrok:
        container_name: ngrok
        image: ngrok/ngrok:3
        command: http https://gateway:2443
        restart: unless-stopped
        depends_on:
            gateway:
                condition: service_started
        networks:
            - backend-network
        env_file:
            - .env.shared

volumes:
    postgres_data:
    uploads_data:

networks:
    backend-network:
        driver: bridge
