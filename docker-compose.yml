services:
    postgres:
        container_name: transcendence_postgres
        image: postgres:17-alpine
        restart: unless-stopped
        networks:
            - backend-network
        expose:
            - "5432"
        env_file:
            - .env.shared
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    db-migration:
        container_name: transcendence_db_migration
        image: transcendence_db_migration:20-alpine
        build:
            context: .
            dockerfile: ./db-migration/Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        networks:
            - backend-network
        env_file:
            - .env.shared
        volumes:
            - ./shared/prisma:/app/prisma

    auth-service:
        container_name: transcendence_auth_service
        image: transcendence_auth_service:20-alpine
        build:
            context: .
            dockerfile: ./auth-service/Dockerfile
            target: build
        command: npm run start:dev
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3002"
        env_file:
            - ./auth-service/.env
            - .env.shared
        volumes:
            - ./auth-service/src:/app/auth-service/src
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3002/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    user-service:
        container_name: transcendence_user_service
        image: transcendence_user_service:20-alpine
        build:
            context: .
            dockerfile: ./user-service/Dockerfile
            target: build
        command: sh -c "npm run prisma:generate && npm run start:dev"
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3001"
        ports:
            - "127.0.0.1:3001:3001"
        env_file:
            - .env.shared
        volumes:
            - ./user-service/src:/app/user-service/src
            - ./shared/prisma/schema.prisma:/app/prisma/schema.prisma:ro
            - uploads_data:/uploads
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3001/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    game-service:
        container_name: transcendence_game_service
        image: transcendence_game_service:20-alpine
        build:
            context: .
            dockerfile: ./game-service/Dockerfile
            target: build
        command: sh -c "npm run prisma:generate && npm run start:dev"
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3000"
        env_file:
            - .env.shared
        volumes:
            - ./game-service/src:/app/game-service/src
            - ./shared/prisma/schema.prisma:/app/prisma/schema.prisma:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3000/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    gateway:
        container_name: api_gateway
        image: nginx:stable-alpine
        restart: unless-stopped
        depends_on:
            auth-service:
                condition: service_healthy
            user-service:
                condition: service_healthy
            game-service:
                condition: service_healthy
        networks:
            - backend-network
        ports:
            - "2443:2443"
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
            - ./nginix/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs

    ngrok:
        container_name: ngrok
        image: ngrok/ngrok:3
        command: http https://gateway:2443
        restart: unless-stopped
        depends_on:
            gateway:
                condition: service_started
        networks:
            - backend-network
        env_file:
            - .env.shared
        environment:
            - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}

volumes:
    postgres_data:
    uploads_data:

networks:
    backend-network:
        driver: bridge
