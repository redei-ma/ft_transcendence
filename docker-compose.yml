# =============================================================
#  docker-compose.yml — PRODUCTION configuration
#
#  Uses the "production" Docker stage for all NestJS services:
#  TypeScript is already compiled during "docker build", so
#  containers start in ~10s instead of ~2min.
#
#  For local development, Docker Compose automatically merges
#  this file with docker-compose.override.yml (if present),
#  which switches services back to watch mode with hot reload.
#
#  To run in production mode explicitly (ignoring the override):
#    docker compose -f docker-compose.yml up -d --build
#  or simply:
#    make up-prod
# =============================================================

# Shared healthcheck defaults — referenced with <<: *healthcheck.
# start_period is short because production containers start fast.
x-healthcheck: &healthcheck
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
    # ---------------------------------------------------------
    #  Infrastructure
    # ---------------------------------------------------------

    postgres:
        container_name: transcendence-postgres
        image: postgres:17-alpine
        restart: unless-stopped
        networks:
            - backend-network
        expose:
            - "5432"
        env_file:
            - .env.shared
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    db-migration:
        container_name: transcendence-db-migration
        image: transcendence-db-migration:latest
        build:
            context: .
            dockerfile: ./db-migration/Dockerfile
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - backend-network
        env_file:
            - .env.shared
        volumes:
            - ./shared/prisma:/app/prisma

    redis:
        container_name: transcendence-redis
        image: redis:alpine
        restart: unless-stopped
        networks:
            - backend-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    # ---------------------------------------------------------
    #  Application services — production stage
    #  "node dist/main" — no TypeScript compilation at startup.
    # ---------------------------------------------------------

    auth-service:
        container_name: transcendence-auth
        image: transcendence-auth:latest
        build:
            context: .
            dockerfile: ./auth-service/Dockerfile
            target: production
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3002"
        env_file:
            - .env.shared
            - ./auth-service/.env
        environment:
            NODE_ENV: production
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3002/health || exit 1",
                ]
            <<: *healthcheck

    user-service:
        container_name: transcendence-user
        image: transcendence-user:latest
        build:
            context: .
            dockerfile: ./user-service/Dockerfile
            target: production
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
        networks:
            - backend-network
        expose:
            - "3001"
        env_file:
            - .env.shared
            - ./user-service/.env
        environment:
            NODE_ENV: production
        volumes:
            # Upload directory must persist across restarts.
            - uploads_data:/uploads
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3001/health || exit 1",
                ]
            <<: *healthcheck

    game-service:
        container_name: transcendence-game
        image: transcendence-game:latest
        build:
            context: .
            dockerfile: ./game-service/Dockerfile
            target: production
        restart: unless-stopped
        depends_on:
            db-migration:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        networks:
            - backend-network
        expose:
            - "3000"
        env_file:
            - .env.shared
            - ./game-service/.env
        environment:
            NODE_ENV: production
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3000/health || exit 1",
                ]
            <<: *healthcheck

    matchmaking-service:
        container_name: transcendence-matchmaking
        image: transcendence-matchmaking:latest
        build:
            context: .
            dockerfile: ./matchmaking-service/Dockerfile
            target: production
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - backend-network
        expose:
            - "3500"
        env_file:
            - .env.shared
        environment:
            NODE_ENV: production
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3500/health || exit 1",
                ]
            <<: *healthcheck

    # ---------------------------------------------------------
    #  Frontend
    #  NOTE: kept in build/dev mode because nginx.conf (gateway)
    #  proxies to frontend:5173 (Vite dev server). Switching to
    #  the production stage (nginx on :80) also requires updating
    #  nginx.conf — left as a future task.
    # ---------------------------------------------------------

    frontend:
        container_name: transcendence-frontend
        image: transcendence-frontend:latest
        build:
            context: ./frontend
            dockerfile: Dockerfile
            target: build
        command: npm run dev -- --host
        restart: unless-stopped
        networks:
            - backend-network
        expose:
            - "5173"
        volumes:
            - ./frontend/src:/app/src
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
            <<: *healthcheck

    # ---------------------------------------------------------
    #  Gateway + tunnel
    # ---------------------------------------------------------

    gateway:
        container_name: transcendence-gateway
        image: nginx:stable-alpine
        restart: unless-stopped
        depends_on:
            auth-service:
                condition: service_healthy
            user-service:
                condition: service_healthy
            game-service:
                condition: service_healthy
            matchmaking-service:
                condition: service_healthy
            frontend:
                condition: service_healthy
        networks:
            - backend-network
        ports:
            - "2443:2443"
            - "2080:2080"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs
            - uploads_data:/uploads

    ngrok:
        container_name: transcendence-ngrok
        image: ngrok/ngrok:3
        command: http https://gateway:2443
        restart: unless-stopped
        depends_on:
            gateway:
                condition: service_started
        networks:
            - backend-network
        env_file:
            - .env.shared

volumes:
    postgres_data:
    uploads_data:

networks:
    backend-network:
        driver: bridge
