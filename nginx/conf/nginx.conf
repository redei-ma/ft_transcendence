server {
    listen 80;
    server_name Clash_Of_Olympus;
    # Spegne tutti i log di accesso
    access_log off;
    # Mostra solo gli errori critici (ignora i "warn" e le info)
    error_log /var/log/nginx/error.log error;
    location /{
        proxy_pass http://frontend:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /game_api/{
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /matchmaking_api/{
        proxy_pass http://matchmaking-service:3500/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}