events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Hide Nginx version from response headers to reduce information exposure.
    server_tokens off;

    # Allow up to 5 MB request bodies to support avatar file uploads.
    client_max_body_size 5m;

    # Resource limits: prevent slow-client attacks and zombie connections.
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # ---------------------------------------------------------------------------
    # Rate limiting zones (keyed by client IP, binary format saves ~2/3 memory).
    # ---------------------------------------------------------------------------

    # Login and 2FA verification: tight limit to prevent brute-force attacks.
    limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=10r/m;

    # Account creation and password reset: prevent spam and account enumeration.
    limit_req_zone $binary_remote_addr zone=auth_write:10m    rate=5r/m;

    # Verification email resend: very tight to prevent email flooding.
    limit_req_zone $binary_remote_addr zone=auth_resend:10m   rate=3r/m;

    # Avatar upload: restrict to protect server CPU (Sharp processing) and disk.
    limit_req_zone $binary_remote_addr zone=avatar_upload:10m rate=5r/m;

    # General API: broad limit to absorb traffic spikes without blocking normal use.
    limit_req_zone $binary_remote_addr zone=api_general:10m   rate=120r/m;

    # SSE stream: one persistent connection per client, reconnects are rare.
    limit_req_zone $binary_remote_addr zone=sse_stream:10m    rate=20r/m;

    # ---------------------------------------------------------------------------
    # Proxy headers forwarded to all upstream services.
    # ---------------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect.
    # ---------------------------------------------------------------------------
    server {
        listen 2080;
        server_name _;
        return 301 https://$host:2443$request_uri;
    }

    server {
        listen 2443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ---------------------------------------------------------------------------
        # Security headers — inherited only by locations that set no add_header.
        # Any location block that uses add_header must repeat these explicitly
        # (nginx drops server-block inheritance the moment a child sets add_header).
        # ---------------------------------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # unsafe-inline and unsafe-eval required by React/Vite (no CSP nonces).
        # dicebear.com and lh3.googleusercontent.com whitelisted for avatar images.
        # blob: and worker-src blob: required for Three.js GLB loading via Web Workers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.dicebear.com https://lh3.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: wss://$host:2443 https://www.gstatic.com; worker-src blob: 'self'; frame-ancestors 'none';" always;

        # ---------------------------------------------------------------------------
        # Frontend — all requests proxied to the Vite server on :5173.
        # ---------------------------------------------------------------------------

        # Vite-hashed assets (JS, CSS, GLB): the content hash in the filename
        # guarantees freshness, so an immutable long-lived cache is safe.
        # Security headers repeated here because this block sets its own add_header.
        location ~* ^/assets/ {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # HTML entry point and SPA routes: never cache.
        # HMR WebSocket upgrade is also handled here in dev mode.
        # Security headers repeated because this block sets its own add_header.
        location / {
            proxy_pass http://frontend:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.dicebear.com https://lh3.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: wss://$host:2443 https://www.gstatic.com; worker-src blob: 'self'; frame-ancestors 'none';" always;
        }

        # ---------------------------------------------------------------------------
        # User avatars: static files from the shared Docker volume.
        # Long cache lifetime is safe because filenames include a UUID.
        # ---------------------------------------------------------------------------
        location /uploads/ {
            alias /uploads/;
            expires 30d;
            add_header Cache-Control                "public, immutable" always;
            add_header X-Content-Type-Options       "nosniff" always;
            add_header X-Frame-Options              "DENY" always;
            add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        }

        # ---------------------------------------------------------------------------
        # Internal service-to-service routes: deny all external access.
        # ---------------------------------------------------------------------------
        location /internal/ {
            deny all;
        }

        # ---------------------------------------------------------------------------
        # User service: Swagger UI (more specific than /api/, matched first by nginx).
        # ---------------------------------------------------------------------------
        location /api/docs {
            proxy_pass http://user-service:3001/api/docs;
        }

        # ---------------------------------------------------------------------------
        # Auth service: sensitive write endpoints with strict rate limiting.
        # Regex locations take precedence over prefix locations.
        # ---------------------------------------------------------------------------

        # Brute-force protection for login and 2FA code verification.
        location ~ ^/api/auth/(login|2fa/verify)$ {
            limit_req zone=auth_login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://auth-service:3002$request_uri;
        }

        # Spam and enumeration protection for account creation and password reset.
        location ~ ^/api/auth/(register|forgot-password|reset-password)$ {
            limit_req zone=auth_write burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://auth-service:3002$request_uri;
        }

        # Email flood protection for verification resend requests.
        location = /api/auth/resend-verification {
            limit_req zone=auth_resend burst=1 nodelay;
            limit_req_status 429;

            proxy_pass http://auth-service:3002/api/auth/resend-verification;
        }

        # General auth traffic: token refresh, logout, OAuth flow, 2FA setup.
        location /api/auth/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://auth-service:3002/api/auth/;
        }

        # ---------------------------------------------------------------------------
        # User service: SSE stream — buffering disabled so events reach the client immediately.
        # ---------------------------------------------------------------------------
        location = /api/users/me/notifications/stream {
            limit_req zone=sse_stream burst=15 nodelay;
            limit_req_status 429;

            proxy_pass http://user-service:3001/api/users/me/notifications/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # ---------------------------------------------------------------------------
        # User service: avatar upload with strict rate limiting.
        # Exact match (=) takes precedence over prefix match below.
        # ---------------------------------------------------------------------------
        location = /api/users/me/avatar {
            limit_req zone=avatar_upload burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://user-service:3001/api/users/me/avatar;
            proxy_http_version 1.1;
        }

        # ---------------------------------------------------------------------------
        # User service: all remaining user endpoints.
        # ---------------------------------------------------------------------------
        location /api/users/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://user-service:3001/api/users/;
            proxy_http_version 1.1;
        }

        # ---------------------------------------------------------------------------
        # Game service: WebSocket.
        # ---------------------------------------------------------------------------
        location /ws/game/socket.io/ {
            proxy_pass http://game-service:3000/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_read_timeout 86400;
        }

        # ---------------------------------------------------------------------------
        # Matchmaking service: WebSocket.
        # ---------------------------------------------------------------------------
        location /ws/matchmaking/socket.io/ {
            proxy_pass http://matchmaking-service:3500/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_read_timeout 86400;
        }

    }
}
